  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Sidebar navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 200px;
      height: 100%;
      background-color: #333;
      padding-top: 20px;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
    }

    nav ul li {
      margin: 10px 0;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      display: block;
    }

    nav ul li a:hover {
      background-color: #575757;
    }

    /* Main content */
    .content {
      margin-left: 220px; /* space for sidebar */
      padding: 20px;
    }

    footer {
      background-color: #d5ebe7;
      padding: 10px;
      text-align: center;
      color: black;
      margin-left: 220px;
    }
  </style>
</head>
